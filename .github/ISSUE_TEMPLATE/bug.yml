name: 버그 제보
description: 재현 가능한 오류와 사용자 영향을 기록합니다.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        비밀 키, 토큰, 개인 정보가 포함된 로그나 화면은 작성하지 않습니다.
  - type: textarea
    id: problem
    attributes:
      label: 발생한 문제
      description: 실제 결과를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 절차
      description: 다른 팀원이 같은 오류를 확인할 수 있도록 작성합니다.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
    validations:
      required: true
