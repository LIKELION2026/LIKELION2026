name: 디자인 작업
description: 사용자 흐름, 화면, 디자인 시스템, 자산 작업을 등록합니다.
title: "[Design] "
labels:
  - design
body:
  - type: markdown
    attributes:
      value: |
        구현 전 사용자 문제와 화면 기준을 합의합니다. 개인 정보가 포함된 화면 자료는 올리지 않습니다.
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 사용자 문제
      description: 바꾸려는 이유를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: 할 일
      description: 만들 화면 또는 바꿀 흐름을 작성합니다.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 기준
      description: 완료됐다고 판단할 기준을 작성합니다.
    validations:
      required: true
