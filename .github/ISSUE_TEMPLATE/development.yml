name: 개발 작업
description: 프론트엔드, 백엔드, AI, 공통 계약 구현 작업을 등록합니다.
title: "[Dev] "
labels:
  - development
body:
  - type: markdown
    attributes:
      value: |
        구현 전 문제·범위·완료 기준을 합의합니다. API 키, 토큰, 개인 정보는 작성하지 않습니다.
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 사용자 또는 시스템이 겪는 문제를 작성합니다.
    validations:
      required: true
  - type: checkboxes
    id: area
    attributes:
      label: 작업 영역
      options:
        - label: Client
        - label: Server
        - label: AI
        - label: Shared 계약 / Socket 이벤트
        - label: 데이터베이스 또는 외부 API
  - type: textarea
    id: scope
    attributes:
      label: 구현 범위
      description: 변경할 동작, 모듈, 제외 범위를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 기준
      description: 검증 가능한 결과를 체크리스트로 작성합니다.
      placeholder: |
        - [ ] ...
        - [ ] 오류 또는 실패 상황에서 ...
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: 계약 및 의존성 영향
      description: API, Socket 이벤트, Shared 타입, 환경변수, 외부 API 변경 사항을 작성합니다. 없으면 '없음'으로 작성합니다.
  - type: textarea
    id: references
    attributes:
      label: 관련 자료
      description: PRD, Figma, ADR, Discussion, 선행 Issue 링크를 작성합니다.
  - type: input
    id: assignee
    attributes:
      label: 담당자
