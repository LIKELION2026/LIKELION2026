name: 개발 작업
description: 프론트엔드, 백엔드, AI, 공통 계약 구현 작업을 등록합니다.
title: "[Dev] "
labels:
  - development
body:
  - type: markdown
    attributes:
      value: |
        구현 전 문제·범위·완료 기준을 합의합니다. API 키, 토큰, 개인 정보는 작성하지 않습니다.
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 바꾸려는 이유를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: 할 일
      description: 변경할 동작을 작성합니다.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 기준
      description: 완료됐다고 판단할 기준을 작성합니다.
    validations:
      required: true
