name: 작업 및 문서화
description: 리서치, 디자인, 리팩터링, 설정, 문서 작업을 등록합니다.
title: "[Task] "
labels:
  - task
body:
  - type: textarea
    id: purpose
    attributes:
      label: 작업 목적
      description: 왜 지금 이 작업이 필요한지 작성합니다.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 생성하거나 변경할 결과물과 제외 범위를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 검토 가능한 결과를 체크리스트로 작성합니다.
      placeholder: |
        - [ ] 문서 또는 코드가 업데이트된다.
        - [ ] 관련 팀원이 결과를 확인한다.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 관련 자료
      description: PRD, Figma, Discussion, 회의록 또는 선행 Issue 링크를 작성합니다.
  - type: input
    id: assignee
    attributes:
      label: 담당자
