name: 기능 제안
description: 사용자 문제를 해결하는 기능 작업을 등록합니다.
title: "[Feature] "
labels:
  - feature
body:
  - type: markdown
    attributes:
      value: |
        구현 전에 문제와 완료 기준을 합의합니다. 민감한 정보와 비밀 키는 작성하지 않습니다.
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 누가 어떤 상황에서 무엇을 어려워하는지 작성합니다.
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: 할 일
      description: 만들 기능을 간단히 작성합니다.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 기준
      description: 완료됐다고 판단할 기준을 작성합니다.
    validations:
      required: true
